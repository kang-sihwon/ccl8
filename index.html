<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1eddf">
  <title>벨레스 좌표 평면도 · 모바일</title>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
<main>
  <header>
    <h1>벨레스 좌표 평면도</h1>
    <p>371 × 371칸 · 북쪽이 위</p>
  </header>
  <section aria-labelledby="title">
    <small id="zone"></small>
    <h2 id="title">벨레스 (0, 0)</h2>
    <label class="grid-control">보기 범위 <select id="grid-size"></select></label>
    <p id="source"></p>
    <div id="display" aria-busy="true"></div>
    <output id="status" role="status"></output>
    <div id="neighbors" role="group" aria-label="이웃 타일로 이동">
      <button data-step="-1,0">← 서</button><button data-step="0,1">↑ 북</button>
      <button data-step="0,-1">↓ 남</button><button data-step="1,0">→ 동</button>
    </div>
    <label for="places">장소로 이동</label>
    <select id="places"></select>
    <form id="jump">
      <label>동 X <input id="ix" type="number" min="-185" max="185" step="1" value="0" required></label>
      <label>북 Y <input id="iy" type="number" min="-185" max="185" step="1" value="0" required></label>
      <button>타일 열기</button>
    </form>
  </section>
  <details>
    <summary>유역 전체도</summary>
    <canvas id="overview" tabindex="0" aria-label="전체도에서 누른 위치의 타일 열기"></canvas>
    <div class="row"><button id="out" aria-label="전체도 축소">−</button>
      <button id="in" aria-label="전체도 확대">＋</button><button id="fit">전체 보기</button></div>
  </details>
  <details>
    <summary>좌표와 도면 저장</summary>
    <p id="metres"></p>
    <div class="row"><a id="save">이 타일 SVG 저장</a><button id="pack">구역 ZIP 저장</button></div>
  </details>
</main>
<script src="catalog.js"></script>
<script src="packs.js" data-block-base="https://raw.githubusercontent.com/kang-sihwon/ccl8/main/Docs/ArtDirection/EtherWorldMap/Atlas/VelesTarnelRoden-v1/Veles371/blocks/"></script>
<script src="viewer.js" data-original-base="https://github.com/kang-sihwon/ccl8/blob/main/Docs/ArtDirection/EtherWorldMap/Atlas/VelesTarnelRoden-v1/TernPassage/"></script>
</body>
</html>
