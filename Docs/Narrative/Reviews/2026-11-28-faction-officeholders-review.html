<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세력별 직위 인물 배정 검토</title><style>body{max-width:42rem;margin:2rem auto;padding:0 1rem;font:17px/1.65 system-ui,sans-serif;word-break:keep-all}a{color:#185443}</style></head><body><h1>세력별 직위 인물 배정 검토</h1>
<p><strong>PASS.</strong> 독립 검토자는 <a href="../Drafts/2026-10-31-ether-taiga-dawn/2026-11-28-faction-figures.html#representation">이번 이야기의 인물 명부</a>를 이전 명부의 빈자리, 두 도시 인물표, 제작 대본과 대조했다. 베딕과 오르벨의 기존 직업, 위임 주체와 종료 시점이 일치하며 기존 명부의 주요 직위에 보유자가 배정됐다.</p>
<p>첫 검토에서 니베르 책임자의 장부 회수 요구를 현장에서 이미 수색을 시작한 일처럼 읽을 수 있다고 지적했다. 재검토에서 누에트의 조사 위임이 끝나는 시점, 발쿠의 피난 우선, 생존자의 본선 인수 순서를 확인했다. 잔여 지적은 없다. <a href="../Scenario.md#지역-갈등과-선택의-대가">지역별 정본 사건</a></p></body></html>
