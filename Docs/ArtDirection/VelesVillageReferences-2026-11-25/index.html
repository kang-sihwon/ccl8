ation.com/projects/dybwYx","original":"","image":null,"old":true},{"id":"G02","group":"게임 제작자 자료","tag":"길·골목","title":"트로스코비츠 마을","credit":"Josef Šenfeld · 킹덤 컴 딜리버런스 2","note":"광장·갈림길·초지 장면을 연달아 봐. 물터를 지나면서 길이 넓어졌다 다시 좁아지는 속도를 비교해.","source":"https://josefsenfeld.artstation.com/projects/AZg9vX","original":"","image":null,"old":true},{"id":"G03","group":"게임 제작자 자료","tag":"밭·숲","title":"트로스키 지역 풍경","credit":"Josef Šenfeld · 킹덤 컴 딜리버런스 2","note":"밭과 숲이 만나는 경계에서 나무 크기와 풀의 밀도를 비교해. 서쪽 경작지와 북쪽 숲문을 같은 식생으로 덮을지 판단해.","source":"https://josefsenfeld.artstation.com/projects/x32zBr","original":"","image":null,"old":true},{"id":"G04","group":"게임 제작자 자료","tag":"집·창","title":"마을 건물과 생활 소품","credit":"Tomáš Svojša · 킹덤 컴 딜리버런스 2","note":"원문의 Village house와 small barns를 대조해. 창이 있는 벽, 헛간의 큰 문, 사람이 머무는 처마 밑을 살펴봐.","source":"https://svojto.artstation.com/projects/3EZkZJ","original":"","image":null,"old":true},{"id":"G05","group":"게임 제작자 자료","tag":"강·나루","title":"라타이 강변","credit":"Henrieta Vajsabelova · 킹덤 컴 딜리버런스","note":"강가에 선 사람, 가까운 자갈, 안개 속 능선이 따로 보여. 기슭 한 구간에 돌을 어느 정도 흩뜨릴지 비교해.","source":"https://siriusbudha.artstation.com/projects/aRVV20","original":"","image":null,"old":true},{"id":"G06","group":"게임 제작자 자료","tag":"길·골목","title":"발할라의 마을들","credit":"Martin Mitov · 어쌔신 크리드 발할라","note":"서로 다른 취락 장면을 넘기며 한 동만으로 기억되는 집을 골라봐. 벨레스 공방이 랜드마크로 읽힐 조건을 비교해.","source":"https://mitovdev.artstation.com/projects/D5Q29n","original":"","image":null,"old":true},{"id":"G09","group":"게임 제작자 자료","tag":"공방·시장","title":"투생의 마상 시합장","credit":"Kuba Wichnowski · 위쳐 3 블러드 앤 와인","note":"임시 시설과 천막이 바깥 공간을 나누는 방식을 봐. 벨레스에서는 겨자색 천막 하나가 차지할 면적을 판단하는 자료야.","source":"https://kubatuba.artstation.com/projects/w5J3V","original":"","image":null,"old":true},{"id":"G10","group":"게임 제작자 자료","tag":"밭·숲","title":"멀리서 보이는 트로스키","credit":"Matěj Bejček · 킹덤 컴 딜리버런스 2","note":"길 위의 사람과 먼 랜드마크 사이에 몇 겹의 경관이 놓이는지 보자. 숲으로 향하면서 공방 지붕이 사라지는 시점을 비교해.","source":"https://matejbejcek.artstation.com/projects/rlDova","original":"","image":null,"old":true},{"id":"G11","group":"게임 제작자 자료","tag":"집·창","title":"던 틴 성과 주변 환경","credit":"Kuba Wichnowski · 위쳐 3 블러드 앤 와인","note":"돌 구조물의 규모가 주변 주택을 압도하는 정도를 봐. 벨레스에서 공방을 어느 크기까지 강조할지 보는 상한 사례야.","source":"https://kubatuba.artstation.com/projects/GLxWQ","original":"","image":null,"old":true},{"id":"I01","group":"현대 콘셉트·일러스트","tag":"길·골목","title":"위쳐 3 마을 콘셉트","credit":"Marek Madej · The Witcher 3","note":"지붕의 크고 작은 덩어리만 남겨도 마을이 읽히는지 봐. 벨레스의 붉은 지붕이 한 색 띠로 뭉칠 때 비교해.","source":"https://banditpencil.artstation.com/projects/xRzX","original":"","image":null,"old":true},{"id":"I02","group":"현대 콘셉트·일러스트","tag":"길·골목","title":"매너 로드 키 아트","credit":"Wojtek Fus · Manor Lords","note":"한 장에 담긴 규모감과 실제 걸을 때 필요한 눈높이를 비교해. 높은 시점에서만 매력적인 구도를 걸러내는 기준이야.","source":"https://fus.artstation.com/projects/n0nYrX","original":"","image":null,"old":true},{"id":"I03","group":"현대 콘셉트·일러스트","tag":"강·나루","title":"부두의 중세 어시장","credit":"Jina Park · 환경 일러스트","note":"배에서 물건이 내려온 뒤 어디에서 팔리는지 상상해 봐. 벨레스 잔교 끝의 작업과 길을 연결하는 참고야.","source":"https://magicpja.artstation.com/projects/q6dEP","original":"","image":null,"old":true},{"id":"I04","group":"현대 콘셉트·일러스트","tag":"공방·시장","title":"판타지 마을의 대장간","credit":"Alexandru Fusea · 건축 콘셉트","note":"먼저 작업장이라고 읽히는 요소를 하나 골라봐. 공방에 남길 처마·배기구·야외 작업대의 우선순위를 정하기 좋아.","source":"https://alexandrufusea.artstation.com/projects/v2y2vD","original":"","image":null,"old":true},{"id":"I05","group":"현대 콘셉트·일러스트","tag":"공방·시장","title":"Butterflies 대장간","credit":"Juliane Hernandes Barone · 콘셉트 아트","note":"실루엣으로 설명되는 설비와 가까이 가야 보이는 도구를 나눠 봐. 작업 마당에서 정보가 몰리는 곳을 조절할 수 있어.","source":"https://anebarone.artstation.com/projects/wJb26V","original":"","image":null,"old":true},{"id":"I06","group":"현대 콘셉트·일러스트","tag":"밭·숲","title":"산속의 중세 마을","credit":"Jiseong Kim · 환경 일러스트","note":"집 위로 얼마나 많은 산과 하늘이 보이는지 비교해. 산자락과 숲이 마을을 감싸는 느낌을 고르는 자료야.","source":"https://jiseongkim.artstation.com/projects/rJbY12","original":"","image":null,"old":true},{"id":"I07","group":"현대 콘셉트·일러스트","tag":"길·골목","title":"Medieval Village","credit":"Michal Kváč · 환경 일러스트","note":"집과 하늘 사이에 생기는 큰 색면을 봐. 서정적인 반실사에 어느 정도의 색 대비를 원하는지 고르기 좋아.","source":"https://kvacm.artstation.com/projects/y4rm6J","original":"","image":null,"old":true},{"id":"I08","group":"현대 콘셉트·일러스트","tag":"집·창","title":"중세 판타지 건축군","credit":"Fabrizio Carminati · 건물 디자인","note":"각 건물에서 문·창·지붕 중 무엇이 먼저 눈에 들어오는지 비교해. 주택과 공방을 다른 비례로 설계할 근거가 돼.","source":"https://fabriziocarminati.artstation.com/projects/gzOBG","original":"","image":null,"old":true},{"id":"I09","group":"현대 콘셉트·일러스트","tag":"길·골목","title":"중세 마을 구상","credit":"Juwon Lee · 환경 콘셉트","note":"골목 안쪽을 어디까지 보여 주는지 봐. 공방 앞 첫 화면에서 물터 방향을 알려 줄 시선의 틈을 찾을 수 있어.","source":"https://juwonlee.artstation.com/projects/lVGgVY","original":"","image":null,"old":true},{"id":"I10","group":"현대 콘셉트·일러스트","tag":"집·창","title":"등각 시점의 중세 마을","credit":"Mykhailo N · 스타일화 환경 콘셉트","note":"위에서 본 지붕 모양과 마당의 관계를 비교해. 같은 모양의 집이 반복될 때 가장 먼저 바꿀 부분을 찾기 좋아.","source":"https://hamstersgaming.artstation.com/projects/o0A6kO","original":"","image":null,"old":true},{"id":"I11","group":"현대 콘셉트·일러스트","tag":"집·창","title":"Medieval Village Concept","credit":"Marina Ovchinnikova · 환경 콘셉트","note":"같은 지붕을 작은 실루엣 스케치에서 입면으로 발전시킨 과정을 봐. 공방과 주택 한 채씩을 고를 때 무엇을 먼저 비교할지 보여줘.","source":"https://marinaovchkv.artstation.com/projects/Dxw5m0","original":"","image":null,"old":true},{"id":"P02","group":"회화·필사본","tag":"밭·숲","title":"기도서 3월 도판","credit":"림부르 형제 등 · 샹티이 소장, 도판은 Commons","note":"앞쪽의 밭고랑과 먼 건물 사이에 시선이 머무는 층을 세어 봐. 마을 전경의 깊이를 비교하는 한 장이야.","source":"https://commons.wikimedia.org/wiki/File:Les_Tr%C3%A8s_Riches_Heures_du_duc_de_Berry_mars.jpg","original":"","image":null,"old":true},{"id":"P03","group":"회화·필사본","tag":"길·골목","title":"좋은 정부의 효과, 도시","credit":"암브로조 로렌체티 · 시에나 시립미술관 · 14세기","note":"거리에서 일하는 사람과 열린 건물 정면을 같이 봐. 벨레스에서도 소품을 먼저 늘리기 전에 사람이 서는 곳을 그려 볼 수 있어.","source":"https://museocivico.comune.siena.it/opere/effetti-del-buon-governo-in-citta","original":"","image":null,"old":true},{"id":"P04","group":"회화·필사본","tag":"밭·숲","title":"좋은 정부의 효과, 전원","credit":"암브로조 로렌체티 · 시에나 · 14세기, 도판은 Commons","note":"성벽 밖에서 밭으로 내려가는 길의 흐름을 따라가 봐. 농지 쪽으로 갈수록 집이 드문드문해지는 전환을 볼 수 있어.","source":"https://commons.wikimedia.org/wiki/File:Ambrogio_Lorenzetti_-_Effects_of_Good_Government_in_the_countryside_-_Google_Art_Project.jpg","original":"","image":null,"old":true},{"id":"P05","group":"회화·필사본","tag":"밭·숲","title":"추수하는 사람들","credit":"피터르 브뤼헐 · 메트로폴리탄 미술관 · 1565년","note":"큰 황금빛 밭 안에 길과 일하는 무리가 어떻게 나뉘는지 봐. 벨레스의 황금빛을 지붕과 식생 중 어디에 집중할지 비교해.","source":"https://www.metmuseum.org/art/collection/search/435809","original":"","image":null,"old":true},{"id":"P06","group":"회화·필사본","tag":"강·나루","title":"운하 옆의 오두막","credit":"렘브란트 · 미국 국립미술관 · 근세 판화","note":"낮은 지붕과 수면을 몇 겹의 선으로 구분하는지 보자. 나루를 멀리서 봐도 남아야 할 윤곽을 찾기 좋아. 원문에서 전체 판면을 볼 수 있어.","source":"https://www.nga.gov/artworks/9939-cottage-beside-canal","original":"","image":null,"old":true},{"id":"P07","group":"회화·필사본","tag":"강·나루","title":"운하 옆 마을","credit":"요하네스 라위스허르 등 · 미국 국립미술관 · 근세 판화","note":"물가가 화면을 가로지르는 방향과 가옥들이 물러선 폭을 비교해. 잔교 너머 집의 앞뒤 간격을 보는 자료야. 원문에서 전체 판면을 볼 수 있어.","source":"https://www.nga.gov/artworks/79395-village-beside-canal","original":"","image":null,"old":true},{"id":"P08","group":"회화·필사본","tag":"밭·숲","title":"대포가 있는 풍경","credit":"알브레히트 뒤러 · 미국 국립미술관 · 1518년","note":"먼 집과 산등성이의 명암이 앞쪽 인물과 얼마나 다른지 봐. 숲길 끝 마을 윤곽을 그릴 때 유용해.","source":"https://www.nga.gov/artworks/599-landscape-cannon","original":"","image":null,"old":true},{"id":"P09","group":"회화·필사본","tag":"길·골목","title":"미델하르니스의 가로수길","credit":"메인더르트 호베마 · 런던 내셔널 갤러리 · 1689년","note":"길을 따라선 나무가 지평선까지 시야를 이끄는 방식을 봐. 숲문이 얼마나 일찍 보여야 할지 비교해.","source":"https://www.nationalgallery.org.uk/paintings/meindert-hobbema-the-avenue-at-middelharnis","original":"","image":null,"old":true},{"id":"P10","group":"회화·필사본","tag":"집·창","title":"델프트 풍경","credit":"카렐 파브리티위스 · 런던 내셔널 갤러리 · 1652년","note":"거리 가까이 있는 사람과 집 모서리의 비례를 봐. 창 하나를 확인할 캐릭터 눈높이 구도와 비교해.","source":"https://www.nationalgallery.org.uk/paint
