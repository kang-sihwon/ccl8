<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벨레스 · 출항 전 지역 콘셉트</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#171a18;color:#eee9da;font:16px/1.65 system-ui,sans-serif}main{max-width:1290px;margin:auto;padding:40px clamp(16px,4vw,64px) 80px}h1,h2{font-family:Georgia,'Malgun Gothic',serif;line-height:1.25}h1{font-size:clamp(28px,5vw,55px);margin:0 0 12px}h2{margin:0 0 14px;font-size:31px}header{margin-bottom:35px}p,figcaption span{color:#c9c5b6}nav{display:flex;flex-wrap:wrap;gap:18px}a{color:#edcc8a}section{margin-bottom:58px}figure{margin:0}figure a{display:block}img{display:block;width:100%;height:auto}figcaption{padding:10px 0 18px}figcaption b,figcaption span{display:block}.hero figcaption b{font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><header><h1>벨레스 · 출항 전 지역 콘셉트</h1><p>마을에서 수원을 찾아갔다가 나루로 돌아오는 첫 장의 공간 시안. 그림을 누르면 원본이 열린다.</p><nav><a href="#v">벨레스 마을</a><a href="#f">금빛 안개 삼림</a><a href="#c">서리뿌리 동굴</a></nav></header><section id="v"><h2>벨레스 마을</h2><figure class="hero"><a href="v00.png"><img src="v00.png" alt="벨레스 마을 전경" ></a><figcaption><b>벨레스 마을 전경</b><span>나루에서 올려다본 마을. 큰 참나무를 기준으로 집과 작업 마당, 물터가 모인다.</span></figcaption></figure><div class="grid"><figure class=""><a href="v01.png"><img src="v01.png" alt="강변 수리 공방" loading="lazy"></a><figcaption><b>강변 수리 공방</b><span>열린 작업채에서 등불을 고친다. 낮은 작업대와 수레바퀴 너머로 마을길이 보인다.</span></figcaption></figure><figure class=""><a href="v02.png"><img src="v02.png" alt="샘물길과 공동 물터" loading="lazy"></a><figcaption><b>샘물길과 공동 물터</b><span>급수가 끊긴 아침. 빈 물통과 물때 자국 옆으로 등불은 여전히 켜져 있다.</span></figcaption></figure><figure class=""><a href="v03.png"><img src="v03.png" alt="큰 참나무 장터와 공동 식탁" loading="lazy"></a><figcaption><b>큰 참나무 장터와 공동 식탁</b><span>귀환한 저녁. 낮 동안 장터였던 참나무 아래에서 주민들이 식탁을 함께 쓴다.</span></figcaption></figure><figure class=""><a href="v04.png"><img src="v04.png" alt="다음 날 아침의 나루" loading="lazy"></a><figcaption><b>다음 날 아침의 나루</b><span>다음 날 아침. 주인공이 예정된 운송선에 오르고 린은 나루에 남는다.</span></figcaption></figure></div></section><section id="f"><h2>금빛 안개 삼림</h2><figure class="hero"><a href="f00.png"><img src="f00.png" alt="금빛 안개 삼림 전경" ></a><figcaption><b>금빛 안개 삼림 전경</b><span>마을 쪽 관리림에서 상류 뿌리 언덕까지. 물길과 서쪽 바위 지대가 길을 고르는 기준이 된다.</span></figcaption></figure><div class="grid"><figure class=""><a href="f01.png"><img src="f01.png" alt="마을 바깥 관리림" loading="lazy"></a><figcaption><b>마을 바깥 관리림</b><span>사람 손이 닿은 어린나무와 낮은 수로가 마을과 깊은 숲 사이의 경계를 이룬다.</span></figcaption></figure><figure class=""><a href="f02.png"><img src="f02.png" alt="동쪽 열매숲" loading="lazy"></a><figcaption><b>동쪽 열매숲</b><span>강보다 높은 단구에 열매 관목과 수지 채취 자리가 있다.</span></figcaption></figure><figure class=""><a href="f03.png"><img src="f03.png" alt="수로 작업림" loading="lazy"></a><figcaption><b>수로 작업림</b><span>수로를 따라 마른 작업 단과 보온 배관이 이어진다. 녹지 속의 국소 결빙이 이상을 드러낸다.</span></figcaption></figure><figure class=""><a href="f04.png"><img src="f04.png" alt="서쪽 바위숲과 원목 작업장" loading="lazy"></a><figcaption><b>서쪽 바위숲과 원목 작업장</b><span>화강암 사이로 굽은 길이 원목 적치장과 수레가 드나드는 야외 작업채로 열린다.</span></figcaption></figure><figure class=""><a href="f05.png"><img src="f05.png" alt="상류 물가" loading="lazy"></a><figcaption><b>상류 물가</b><span>젖은 둔덕과 얕은 물가에 곰의 흔적이 남고 상류에는 관리교가 걸린다.</span></figcaption></figure><figure class=""><a href="f06.png"><img src="f06.png" alt="뿌리 언덕" loading="lazy"></a><figcaption><b>뿌리 언덕</b><span>서쪽 길과 관리로가 거목 뿌리 아래의 작은 샘 입구로 모인다.</span></figcaption></figure></div></section><section id="c"><h2>서리뿌리 동굴</h2><figure class="hero"><a href="c00.png"><img src="c00.png" alt="서리뿌리 동굴 통합 단면" ></a><figcaption><b>서리뿌리 동굴 통합 단면</b><span>얼어붙은 취수구에서 작업실을 거쳐 수원 공동의 조작부에 이르는 관계를 펼쳐 본 단면.</span></figcaption></figure><div class="grid"><figure class=""><a href="c01.png"><img src="c01.png" alt="얼어붙은 샘 입구" loading="lazy"></a><figcaption><b>얼어붙은 샘 입구</b><span>바깥의 흙길이 얼어붙은 취수구와 안쪽 정비 통로로 바뀌는 문턱.</span></figcaption></figure><figure class=""><a href="c02.png"><img src="c02.png" alt="옛 장인의 지하 작업실" loading="lazy"></a><figcaption><b>옛 장인의 지하 작업실</b><span>도면과 점검창을 대조해 고장을 알아내는 곳. 실내 파수꾼이 작업 바닥을 점유한다.</span></figcaption></figure><figure class=""><a href="c03.png"><img src="c03.png" alt="거목 아래 수원 공동" loading="lazy"></a><figcaption><b>거목 아래 수원 공동</b><span>바르툴을 붙잡은 외부 결정과 보존할 송수 설비가 같은 공간에 있다.</span></figcaption></figure></div></section><a href="prompts.json">이미지 제작 프롬프트</a></main></html>
