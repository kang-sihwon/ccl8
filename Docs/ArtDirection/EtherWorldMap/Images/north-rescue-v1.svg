<text x="1450.000" y="294.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R02  침엽림 굽이</text>
<text x="1450.000" y="336.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R03  고립 조사대 쉼터</text>
<text x="1450.000" y="378.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R04  피난민 대기 단</text>
<text x="1450.000" y="420.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R05  거수 진로 분기</text>
<text x="1450.000" y="462.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R06  서쪽 식생 골짜기</text>
<text x="1450.000" y="504.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R07  높은 피난 보행로</text>
<text x="1450.000" y="546.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R08  풍하쪽 귀환 단</text>
