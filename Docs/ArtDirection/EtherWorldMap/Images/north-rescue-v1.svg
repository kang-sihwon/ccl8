<text x="1450.000" y="630.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">R10  거인 목축 표식</text>
<text x="1450.000" y="696.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">RG1 가는뿔 1마리: 처치 아닌 유도.</text>
<text x="1450.000" y="738.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">거수는 서쪽, 피난민은 남쪽으로 분리.</text>
<text x="1450.000" y="780.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">RG3·RI1은 23–30의 선택 위험.</text>
<text x="1450.000" y="822.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">고개 NP01은 북쪽 약 6.7km 밖.</text>
<text x="1450.000" y="864.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">여기서 보관소까지 즉시 이동하지 않는다.</text>
