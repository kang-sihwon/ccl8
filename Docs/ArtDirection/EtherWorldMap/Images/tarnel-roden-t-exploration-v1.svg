<text x="450.000" y="1450.000" font-size="20" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">연보라: 무리 이동 / 진보라: 들것 이송 / 겹친 길은 귀환색 우선</text>
<text x="450.000" y="1480.000" font-size="20" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">생활권 원·이동선은 후보 범위, 실제 시야·스폰·추격 판정이 아님</text>
<text x="1450.000" y="199.000" font-size="29" font-family="Malgun Gothic, sans-serif" font-weight="700" fill="#263d43">장소</text>
