<text x="950.000" y="218.000" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#263d43" font-weight="400">운송 거리를 유지한다</text>
<text x="950.000" y="265.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">R1 평면 절점 합 1,270.17 km</text>
<text x="950.000" y="315.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">도착 전 경유·환적·숙박이 필요하다</text>
<text x="950.000" y="365.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">항행 시간·수심·보급 일수는 미정</text>
<text x="950.000" y="415.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">중앙 경유는 S6 시설 조사 해금이 아님</text>
<text x="950.000" y="465.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400"></text>
<text x="950.000" y="515.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">세르나의 세 확대도</text>
<text x="950.000" y="565.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">① 하구: 내륙 나루·갈대·잔해</text>
<text x="950.000" y="615.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">② 항만: 창고·수리·구조·반출</text>
<text x="950.000" y="665.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">③ 좌초선: 전투·선원·암반·승선</text>
<text x="950.000" y="715.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400"></text>
<text x="950.000" y="765.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">출항과 다음 여정</text>
<text x="950.000" y="815.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">로덴 수령·비용 인계까지 확인</text>
<text x="950.000" y="865.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">G1: 계약 외항선으로 아르베나 왕래</text>
<text x="950.000" y="915.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">하르덴: R1 상행→공공 환적→R2·R4</text>
<text x="950.000" y="965.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#657a7a" font-weight="400">세르나에서 만을 가로지르는 새 육로 없음</text>
