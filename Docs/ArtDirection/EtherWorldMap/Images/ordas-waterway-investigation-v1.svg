<text x="1449.000" y="321.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">OG5 사금비늘 3 / OG6 동환 2</text>
<text x="1449.000" y="359.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">OG7 황토 4 / OG8 철갑 3</text>
<text x="1449.000" y="397.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">OG9 적점 4 / OG10 능선갑주 3</text>
<text x="1449.000" y="435.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">OG11 검은갈기 3 / OG12 혹등 1</text>
<text x="1449.000" y="473.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">OG13 철편골 3 (잔류터 선택)</text>
<text x="1449.000" y="511.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">R08 동관은 경고 뒤 선택</text>
<text x="1449.000" y="549.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">경비·생물은 일괄 증원하지 않음</text>
<text x="1449.000" y="587.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">E05에서 봉쇄 안쪽으로 못 넘음</text>
<text x="1449.000" y="625.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">E06-E07-R05 왕복은 별도</text>
<text x="1449.000" y="663.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">물·사료·폐기 흐름이 생활권 형성</text>
<text x="1449.000" y="701.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#687b7b" font-weight="400">실제 전투 접촉 수·시야 미검증</text>
<text x="60.000" y="1077.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">주황 접근 / 보라 귀환 / 파랑 배·급수 시설 / 회색 후속 미개방 / 붉은 선 봉쇄</text>
<text x="60.000" y="1110.000" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#687b7b" font-weight="400">급수 선은 관리 도수·매설관 개념선. 바다에서 식수를 끌어오는 선이 아니다.</text>
