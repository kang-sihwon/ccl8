<text x="1390.000" y="378.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">P04  R2 공공 도로 접속</text>
<text x="1390.000" y="439.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">P01은 기능 기준점; 접안은 서쪽 강가.</text>
<text x="1390.000" y="479.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">P02–P04는 서안 공공 통행.</text>
<text x="1390.000" y="519.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">R2 10km 뒤 관리도시 공공길 → R4.</text>
<text x="1390.000" y="559.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">내부 관리시설·S6 허가와 무관.</text>
<text x="1390.000" y="599.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">상행 화물은 원래 운송자가 로덴에 전달.</text>
<text x="1390.000" y="639.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">주인공·마렌만 고원 편에 승차.</text>
