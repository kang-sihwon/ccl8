<text x="1016.680" y="577.720" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#78668e" font-weight="400">공공 환적장</text>
<text x="1390.000" y="211.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">여행의 네 구간</text>
<text x="1390.000" y="255.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">1 세르나 → 강배 상행 → 공공 환적장</text>
<text x="1390.000" y="303.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">2 공공 검수·휴식 → R2 → 공공 마차</text>
<text x="1390.000" y="351.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">3 R4 계곡길 → 켈바 물 배정·현장 조사</text>
<text x="1390.000" y="399.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">4 R4 고원길 → 하르덴 취수·비룡·시험</text>
<text x="1390.000" y="447.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400"></text>
<text x="1390.000" y="495.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">주인공·마렌은 고원으로, 린은 항만에 남는다.</text>
<text x="1390.000" y="543.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">수리 화물은 담당 운송자가 로덴까지 간다.</text>
<text x="1390.000" y="591.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">켈바·하르덴 확대도는 도시 주변 일부다.</text>
<text x="1390.000" y="639.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">장거리 중간 숙박·보급·우천 휴항 필요.</text>
<text x="1390.000" y="687.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">표시 길이는 투영 절점 합, 여행 일수가 아니다.</text>
<text x="1390.000" y="735.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400"></text>
<text x="1390.000" y="783.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">북부 후속: R4 역행 → R2 도시권 → R3.</text>
<text x="1390.000" y="831.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">공공 통과가 S6 내부 조사 권한을 열지 않는다.</text>
