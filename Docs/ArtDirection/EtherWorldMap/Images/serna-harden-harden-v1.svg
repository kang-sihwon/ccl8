<text x="1390.000" y="208.000" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#263d43" font-weight="700">장소와 역할</text>
<text x="1390.000" y="252.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H01  하단 시험 작업장</text>
<text x="1390.000" y="294.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H02  공동 설계·숙박 마당</text>
<text x="1390.000" y="336.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H03  잔열 운반 작업터</text>
<text x="1390.000" y="378.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H04  채석장 입구</text>
<text x="1390.000" y="420.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H05  회색 채석 단</text>
<text x="1390.000" y="462.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H06  사냥꾼 관찰턱</text>
<text x="1390.000" y="504.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H07  북쪽 접근 능선</text>
<text x="1390.000" y="546.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H08  상류 취수·측정턱</text>
<text x="1390.000" y="588.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H09  비룡 먹이 하역 단</text>
<text x="1390.000" y="630.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H10  수로 바깥 정비길</text>
<text x="1390.000" y="672.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H11  남쪽 바람 그늘길</text>
<text x="1390.000" y="714.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H12  그리핀 초지 사냥턱</text>
<text x="1390.000" y="756.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H13  성체 트롤 저장굴</text>
<text x="1390.000" y="798.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H14  폐축열 시험뜰</text>
<text x="1390.000" y="840.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H15  고원 견인 작업마당</text>
<text x="1390.000" y="882.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">H16  가는날개 번식 절벽</text>
<text x="1390.000" y="943.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">갈색 원: 잠재 생활권, 동시에 싸우지 않음.</text>
<text x="1390.000" y="983.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">HW2는 반복 습격 개체 1마리 / 준비도 18.</text>
<text x="1390.000" y="1023.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">H08은 남쪽 정비길로 먼저 조사 가능.</text>
<text x="1390.000" y="1063.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">H09 처치는 열쇠 문 대신 작업 재개 조건.</text>
<text x="1390.000" y="1103.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">CT02-B는 별도 구조체 / 정비 대안 존재.</text>
<text x="1390.000" y="1143.000" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#657a7a" font-weight="400">임프·도롱뇽은 약한 위험으로 계속 남는다.</text>
