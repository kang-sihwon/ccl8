<text x="500" y="485" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#243f43">급수대 · 316m</text>
<text x="290" y="645" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#243f43">공방 앞 식사 공간 · 314m</text>
<text x="594" y="825" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#243f43">나루 · 302m</text>
<text x="470" y="245" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#243f43">숲 출입구 ↑</text>
<text x="160" y="285" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#267b99">식수는 북쪽 수원에서</text>
<polyline points="840.0000,465.0000 840.0000,595.0000" fill="none" stroke="#267b99" stroke-width="4" stroke-linejoin="round"/>
<polygon points="840.0000,595.0000 835.0000,582.0000 845.0000,582.0000" fill="#267b99" stroke="none" stroke-width="1"/>
<text x="810" y="385" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#267b99">테른 강</text>
<polyline points="630.0000,895.0000 520.0000,945.0000" fill="none" stroke="#8a608d" stroke-width="4" stroke-linejoin="round"/>
<polygon points="520.0000,945.0000 529.7657,935.0687 533.9038,944.1724" fill="#8a608d" stroke="none" stroke-width="1"/>
<text x="230" y="885" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#795280">출항 → 남서쪽 굽이</text>
<text x="1030" y="180" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#243f43">같은 공간을 다섯 번 사용</text>
<text x="1030" y="235" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#243f43">아침: 공방 → 급수대에서 수리</text>
<text x="1030" y="283" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#243f43">고장: 스승 점검 / 친구 비상 운반</text>
<text x="1030" y="331" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#243f43">귀환: 급수 확인 / 정상 사용 재개</text>
<text x="1030" y="379" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#243f43">저녁: 공방 앞 식사 / 도끼 보강</text>
<text x="1030" y="427" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#243f43">다음 날: 기존 나루에서 출항</text>
<text x="1030" y="520" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#243f43">고도와 길</text>
<text x="1030" y="570" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">식수 수원 456m → 급수대 316m</text>
<text x="1030" y="610" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">공방 314m / 나루 302m / 강 300m</text>
<text x="1030" y="650" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">급수대–나루 약 139m, 굽은 운반길</text>
<text x="1030" y="690" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">운반 경사로와 짧은 보행 계단을 분리</text>
<text x="1030" y="730" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">주거·공방은 높은 단, 나루는 낮은 단</text>
<text x="1030" y="810" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#243f43">전경 카메라</text>
<text x="1030" y="855" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#243f43">북동쪽 구릉에서 남서쪽을 본다.</text>
<text x="1030" y="899" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">나루에서는 능선이 세계수를 가리고,</text>
<text x="1030" y="934" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#243f43">하류 굽이 뒤에서 수관을 공개한다.</text>
