<text x="140" y="967" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#243f43">100m</text>
<text x="70" y="1042" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#5c7274">배치도이며 건축 확정안·홍수 검증·수리 설비 상세도는 아님. 기존 색·재료 참조 이미지를 함께 사용.</text>
