<polygon points="925.0000,195.0000 930.0000,208.0000 920.0000,208.0000" fill="#284b51" stroke="none" stroke-width="1"/>
<text x="915" y="175" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#243f43">N</text>
