<text x="60.000" y="1144.000" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#263d43" font-weight="400">주황 육상·잔교 / 보라 다른 귀환 / 파랑 배 이동. 바다 위 선은 도보 연결이 아니다.</text>
