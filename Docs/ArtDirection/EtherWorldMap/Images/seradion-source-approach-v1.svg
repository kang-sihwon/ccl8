<text x="570.000" y="223.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F01 관리교 서단</text>
<text x="570.000" y="268.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F02 관리교 동단</text>
<text x="570.000" y="313.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F03 현용 수원 접수</text>
<text x="570.000" y="358.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F04 설비 내부 경계</text>
<text x="570.000" y="403.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F05 동쪽 강둑길</text>
<text x="570.000" y="448.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F06 하류 제방 연결</text>
<text x="570.000" y="493.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F07 교량 점검 마당</text>
<text x="570.000" y="538.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F08 상류 수면 전망</text>
<text x="570.000" y="673.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">북쪽 물길은 기존 수로 경계에 이어지는 후보다.</text>
<text x="570.000" y="743.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">수원 전체의 기원·수량·고도를 확정하지 않는다.</text>
<text x="570.000" y="813.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">관리교: 양안 접근면 포함 300m, 폭 12m 후보.</text>
<text x="570.000" y="883.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">관리교 사용 전 지지·하중·수위·동의를 확인한다.</text>
<text x="570.000" y="953.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">동쪽 제방은 기존 A11·북교·A14로 돌아간다.</text>
<text x="570.000" y="1023.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">FG14·FG16 늪트롤 / FG15 가는잎 군락</text>
