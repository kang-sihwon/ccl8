<text x="1260.000" y="208.000" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#263d43" font-weight="700">공개: AR1 항만 / AR2 곡창·숲</text>
<text x="1260.000" y="268.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A01-03 하선·통관·귀환 접수</text>
<text x="1260.000" y="313.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A04-07 공개 하역·숙소·조합·비축</text>
<text x="1260.000" y="358.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A08-09 수거·배수 선택 탐색</text>
<text x="1260.000" y="403.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F01-03 곡창 경계·과수·낮은 숲</text>
<text x="1260.000" y="448.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F04-05 쉼터·교환마당 귀환</text>
<text x="1260.000" y="493.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">F06-07 말벌 생활권 북쪽 우회</text>
<text x="1260.000" y="538.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">B01/B02 운하 위 별도 교량</text>
<text x="1260.000" y="583.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A10 남쪽 공공 운반로</text>
<text x="1260.000" y="628.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A11-12 G2 잔해 조사·정비 시험</text>
<text x="1260.000" y="673.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A15 G2 계약 범위의 기록실</text>
<text x="1260.000" y="718.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">J01-A13 G2 조사선 준비</text>
<text x="1260.000" y="763.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A14 연안 조망 / AR3 심부는 밖</text>
<text x="1260.000" y="808.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">A16 항내 통선 대기점</text>
<text x="1260.000" y="923.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">주황 왕로 / 초록 다른 귀환·우회</text>
<text x="1260.000" y="971.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">보라 G2 조사 왕복 / 파랑 입항·승선</text>
<text x="1260.000" y="1019.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">7형태 · 8생활 단위 · 20개체</text>
<text x="1260.000" y="1067.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">별도 CT02-A 1기 / 일반 동물 별도</text>
<text x="1260.000" y="1115.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">요정·고블린을 전부 적으로 세지 않음</text>
<text x="1260.000" y="1163.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">G1·G2 같은 개체·같은 권장 범위</text>
<text x="1260.000" y="1211.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">G2는 계약·현지 허가, 레벨 문이 아님</text>
<text x="60.000" y="1302.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">P01·02 모래귀 6 / P03 청막 3 / P04 통껍질 1 / P05 청목 3 / P06 황띠 4 / P07 유리막 2 / P08 궤짝등 1</text>
<text x="60.000" y="1365.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">A11·A12·A15와 조사선 승선은 허가 구획. 공개 잔교·숙소·귀환로는 조사 중단 때도 유지한다.</text>
<text x="60.000" y="1424.000" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#687b7b" font-weight="400">북쪽 둑길은 숲에서 말벌 둥지를 우회한다. 동·서 교량은 같은 운하를 건너며 잠금 상태를 공유하지 않는다.</text>
