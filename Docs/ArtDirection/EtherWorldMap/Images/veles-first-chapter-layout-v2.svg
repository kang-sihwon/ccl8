<text x="492.79999999999995" y="365.99999999999994" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#263945">동굴 입구</text>
<circle cx="664.0" cy="329.2" r="7" fill="#765c3b" stroke="#ffffff" stroke-width="2"/>
<text x="694.0" y="326.2" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#263945">바르툴·복구</text>
<circle cx="398.0" cy="892.0" r="7" fill="#2d6771" stroke="#ffffff" stroke-width="2"/>
<text x="203.0" y="898.0" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#263945">가림 능선 760 m</text>
<circle cx="300.0" cy="990.0" r="7" fill="#2d6771" stroke="#ffffff" stroke-width="2"/>
<text x="135.0" y="1027.0" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#263945">굽이 뒤 공개</text>
<text x="980" y="209" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#263945">같은 마을 공간을 재사용</text>
<text x="980" y="258" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">나루 수면 610 m / 주거지 625-640 m</text>
<text x="980" y="303" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">공방·급수대·나루: 약 150 m 안쪽</text>
<text x="980" y="348" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">북쪽 숲의 샘 수면 740 m</text>
<text x="980" y="393" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">큰 강과 식수 샘물길은 별도</text>
<text x="980" y="438" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">지역 거목: 140 m, 세계수와 구분</text>
<text x="980" y="483" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">동굴: 입구 → 작업실 → 수원 공동</text>
<text x="980" y="528" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">보스 공동 40 × 32 m, 복구도 같은 곳</text>
<text x="980" y="629" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#263945">플레이 동선</text>
<text x="980" y="678" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">공방에서 보스 공동까지 약 1.46 km</text>
<text x="980" y="723" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">귀환은 같은 숲길 / 추가 전투 없음</text>
<text x="980" y="768" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">출항 후 공개 지점까지 강선 약 1.77 km</text>
<text x="980" y="813" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">이동은 장면 편집 가능 / 항해 조작 없음</text>
<text x="980" y="878" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">능선은 나루의 세계수 방향을 가리고</text>
<text x="980" y="918" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#263945">배는 능선 동쪽을 돌아 남서쪽으로 나간다.</text>
<text x="60" y="1210" font-family="Malgun Gothic, sans-serif" font-size="20" fill="#263945">선형·고도는 신규 설계값이다. 가림 계산은 이 능선만 검사했으며 실제 지형·안개·원경 렌더링은 검증 전이다.</text></svg>
