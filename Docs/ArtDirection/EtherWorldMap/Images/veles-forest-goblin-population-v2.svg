<text x="1470" y="1048" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">청색 파수꾼 / 선은 보행 연결</text>
<text x="1470" y="1096" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">GB05는 이 그림의 면적에 미포함</text>
<text x="1470" y="1144" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a"></text>
<text x="1470" y="1174" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">고블린은 사고 범인으로 확정 안 됨</text>
<text x="1470" y="1222" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">거점 제거 없이 수원 접근 가능</text>
