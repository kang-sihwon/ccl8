<text x="1470" y="922" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a"></text>
<text x="1470" y="952" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">색면은 평소 활동권 후보</text>
