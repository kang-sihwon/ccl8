<text x="65" y="1785" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">기존 15개 장소·길 기준점·수계와 G/W 분포 보존. S01–S04 전투 배치는 이전안으로 보존.</text>
<text x="65" y="1830" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">일반 동물의 수량·고블린 추격·감지·전투 난도·실제 통행은 미검증. 새 시안은 정본 수치가 아니다.</text>
