<text x="1160.000" y="892.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">S1 출항 → S2 도착: 첫 장 경계 유지</text>
<text x="1160.000" y="941.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">S3 첫 화물 수령 회신 후 S4 후속 배</text>
<text x="1160.000" y="990.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">S4: R1 상행 1,130.1 km + R2 10 km</text>
<text x="1160.000" y="1039.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">      R4 서행 1,541.0 km</text>
<text x="1160.000" y="1088.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">S5: R4 복귀 + R3 북행 + B03/B04</text>
<text x="1160.000" y="1137.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">      새 고개 접근은 후보 회랑</text>
<text x="1160.000" y="1186.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">S6: 북부 길 역행 후 도시에서 준비</text>
<text x="1160.000" y="1235.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">      공공 통과 ≠ 안쪽 설비 출입권</text>
<text x="1160.000" y="1284.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">린: 항만 잔류 / 마렌·이르: 중앙 귀환</text>
<text x="1160.000" y="1333.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">이동 시간·보급량·실제 통행은 미검증</text>
