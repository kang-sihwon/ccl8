<text x="860" y="175" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E01 경계 뒤쪽 관측</text>
<text x="860" y="209" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E02 통로 측면 마당</text>
<text x="860" y="243" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E03 정비 진입턱</text>
<text x="860" y="277" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E04 외부 정지·대기</text>
<text x="860" y="311" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E05 서측 전투 발판</text>
<text x="860" y="345" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E06 동측 전투 발판</text>
<text x="860" y="379" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E07 북동 회수 발판</text>
<text x="860" y="413" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E08 북서 작업 발판</text>
<text x="860" y="447" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E09 심부 잔류 연결</text>
<text x="860" y="481" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E10 파편 격리 대기</text>
<text x="860" y="515" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E11 동쪽 철수턱</text>
<text x="860" y="549" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">E12 서쪽 철수턱</text>
<text x="860" y="628" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">파랑: 접근·전투 / 초록: RC1 무력화 뒤 작업</text>
<text x="860" y="664" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">주황 바깥선: 같은 길로 철수 가능</text>
<text x="860" y="700" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">Q15는 적 중심이며 보행 종점이 아님</text>
<text x="860" y="736" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">HG1 4명·54 / HG2 4명·56 / RC1 1기·60</text>
<text x="860" y="772" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">RG1-RG3 기존 생활권·수치 유지</text>
<text x="860" y="808" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">E09는 RC1 100m 범위 안: 전투 전 작업 불가</text>
<text x="860" y="844" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">E04 외부 대기: 범위 밖, 실제 안전은 미검증</text>
<text x="860" y="880" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">M1 구동 몸체 / M2·M3 낮은 엄폐 후보</text>
<text x="860" y="916" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">W1·W2 작업 배수로: 주민 급수 계통 아님</text>
<text x="860" y="952" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">경비 해제 → RC1 → 분리 → C13 인계</text>
<text x="860" y="988" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">58 → 59 → 60 / 선택 +2 경로 60 → 62</text>
<text x="860" y="1024" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">북측 Q12 망령길은 기본 철수로 아님</text>
