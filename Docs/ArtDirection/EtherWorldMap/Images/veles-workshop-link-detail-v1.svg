<text x="60" y="108" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" fill="#233c40">좌표 기반 상세 후보 · 북쪽 ↑ · 설계 폭(m) 표시 · 기존 기준점과 수로 보존</text>
<text x="60" y="151" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#5b6b65">관찰선은 지정한 두 점의 비교다. 감지 거리·확정 교전·완전한 안전을 뜻하지 않는다.</text>
