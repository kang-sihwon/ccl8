<text x="70" y="1080" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#254047">지역 일반 적·정예·보스는 서로 다른 기준을 쓴다. 낮은 레벨 개체도 남으며, 일반 동물에게 이 곡선을 적용하지 않는다.</text>
<text x="70" y="1132" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#254047">주 경로만으로 다음 구간에 진입할 성장량을 목표로 한다. 선택 탐색·반복 사냥을 필수 레벨 노가다로 요구하지 않는다.</text>
