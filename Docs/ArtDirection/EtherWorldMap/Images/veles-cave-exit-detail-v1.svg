<text x="1540" y="220" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="31" font-weight="700" fill="#233c40">통행과 싸울 자리</text>
<text x="1540" y="264" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="400" fill="#233c40">동굴에서 서쪽으로</text>
<text x="1540" y="303" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">기준 319.5m → 상세 326.2m</text>
<text x="1540" y="340" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" fill="#233c40">문턱 5m / 바깥길 6–8m</text>
<text x="1540" y="380" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">Q1 18×14m · 출구 앞마당</text>
<text x="1540" y="417" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">Q2 20×16m · 서쪽 시야</text>
<text x="1540" y="454" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">Q3 22×18m · 조망 바위</text>
<text x="1540" y="520" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" fill="#233c40">차폐물 높이 (주변 바닥 기준)</text>
<text x="1540" y="560" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#233c40">C1 바위 3.2m / C2 뿌리·바위 3.8m</text>
<text x="1540" y="596" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">C3 자재 더미 0.8m</text>
<text x="1540" y="633" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">낮은 자재는 완전 엄폐가 아님</text>
<text x="1540" y="699" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#233c40">관찰선 예시</text>
<text x="1540" y="741" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">녹색: 목록의 높은 장애물 없음</text>
<text x="1540" y="778" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">붉은색: 높은 바위에 가림</text>
<text x="1540" y="815" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#233c40">눈·대상 점 높이 1.6m의 평지 가정</text>
<text x="1540" y="851" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#233c40">소리와 움직이는 적의 시야는 별도</text>
<text x="1540" y="916" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#233c40">접근 판단</text>
<text x="1540" y="958" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">G04 미처리 시 출구 앞도 위험</text>
<text x="1540" y="995" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">C2 뒤에서 G03 방향을 가리고</text>
<text x="1540" y="1032" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">Q2에서 다시 물가·늑대를 살핀다.</text>
<text x="1540" y="1098" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#233c40">새 적·잠금·전투 종료선 없음</text>
<text x="60" y="1305" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#233c40">색면: 기존 평소 생활권 / 원형 점: 무리 기준점 (현재 개체 위치 아님)</text>
<text x="60" y="1353" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#5b6b65">실제 지형·고저차·공격·카메라·AI 미검증. 기존 지도 보존. 본 도면은 새 상세 후보다.</text>
