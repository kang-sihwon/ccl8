<text x="1040" y="745" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">I18 남은 기록함</text>
<text x="1040" y="777" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">I19 동쪽 마른 우회</text>
<text x="1040" y="809" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">I20 능선거인 선택 경계</text>
<text x="1040" y="841" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">I21 피난처 위 관찰턱</text>
<text x="1040" y="913" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">파랑: 수색·조사 / 주황: 다른 귀환</text>
<text x="1040" y="945" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">녹색: 생활권 우회 / 보라: 선택 접근</text>
<text x="1040" y="977" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">회색: 이전안 경로·개체, 상태 승계</text>
<text x="1040" y="1009" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">동그라미: 생활 반경, 감지 확정 아님</text>
<text x="1040" y="1041" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">N18부터 신규 I00-I21로 이어짐</text>
<text x="1040" y="1073" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">구조 왕복 → 별도 보스·장치 조사</text>
<text x="1040" y="1105" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">본선 16 → 생존자 8 회수 후 24</text>
<text x="1040" y="1137" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">소형정 첫 회수 8 / 둘째 회수 10</text>
<text x="1040" y="1169" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#293d42">54→58 / G6·세라디온 귀항 미완료</text>
