<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1060" viewBox="0 0 1900 1060">
<rect width="1900" height="1060" fill="#f0f3ef"/>
<text x="50.000" y="72.000" font-family="Malgun Gothic,sans-serif" font-size="40" fill="#263d43" font-weight="700">오르다스에서 세라디온으로</text>
<text x="50.000" y="119.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">수송·조건 관계도 | 배치 방향과 간격은 지리·거리·항해 시간이 아님</text>
<polygon id="stage-O" points="60.000,220.000 350.000,220.000 350.000,330.000 60.000,330.000" fill="#e0e8e2" stroke="#47715c"/>
<text x="75.000" y="281.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">오르다스 외항</text>
<polygon id="stage-L" points="420.000,220.000 710.000,220.000 710.000,330.000 420.000,330.000" fill="#e0e8e2" stroke="#47715c"/>
<text x="435.000" y="281.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">T09 루세아</text>
<polygon id="stage-D" points="780.000,220.000 1070.000,220.000 1070.000,330.000 780.000,330.000" fill="#e0e8e2" stroke="#47715c"/>
<text x="795.000" y="281.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">M06 동안항</text>
<polygon id="stage-G" points="1140.000,220.000 1430.000,220.000 1430.000,330.000 1140.000,330.000" fill="#e0e8e2" stroke="#47715c"/>
<text x="1155.000" y="281.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">G4 출항 판단</text>
<polygon id="stage-S" points="1500.000,220.000 1790.000,220.000 1790.000,330.000 1500.000,330.000" fill="#e0e8e2" stroke="#47715c"/>
<text x="1515.000" y="281.000" font-family="Malgun Gothic,sans-serif" font-size="26" fill="#263d43" font-weight="700">SE-P01 기항항</text>
<polyline id="leg-T3" points="350.000,275.000 420.000,275.000" fill="none" stroke="#397c99" stroke-width="4"/>
<text x="356.000" y="253.000" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#263d43" font-weight="400">T3</text>
<polyline id="leg-T4" points="710.000,275.000 780.000,275.000" fill="none" stroke="#397c99" stroke-width="4"/>
<text x="716.000" y="253.000" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#263d43" font-weight="400">T4</text>
<polyline id="leg-contract" points="1070.000,275.000 1140.000,275.000" fill="none" stroke="#397c99" stroke-width="4"/>
<text x="1076.000" y="253.000" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#263d43" font-weight="400">계약</text>
<polyline id="leg-T5" points="1430.000,275.000 1500.000,275.000" fill="none" stroke="#397c99" stroke-width="4"/>
<text x="1436.000" y="253.000" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#263d43" font-weight="400">T5</text>
<text x="70.000" y="465.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">T3 / T4</text>
<text x="300.000" y="465.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">구간 배편·귀환 계약으로 이용. G4 이전에도 동안항에서 준비 가능.</text>
<text x="70.000" y="541.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">원양 계약</text>
<text x="300.000" y="541.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">선체 인수·선원 고용·왕복 비축·귀환 협약을 출항 전에 확인.</text>
<text x="70.000" y="617.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">G4 / T5</text>
<text x="300.000" y="617.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">기존 통행 회복·초청·항해 자료와 원양 계약을 모두 충족한 뒤 출항.</text>
<text x="70.000" y="693.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">도착 / 귀환</text>
<text x="300.000" y="693.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">현지 도선·통관 뒤 공개 탐색. G5·보스 처치 없이 계약 귀환 가능.</text>
<text x="70.000" y="769.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">동료 / 증거</text>
<text x="300.000" y="769.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">마렌 동행, 린·이르 담당지 유지. 현지 운영 원본은 남기고 사본을 인계.</text>
<text x="70.000" y="845.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="700">성장</text>
<text x="300.000" y="845.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">환승 44 유지 → 세라디온 첫 조사 45. 남은 전반 예산 +7, 목표 52.</text>
<text x="70.000" y="978.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#687b7b" font-weight="400">추천: 루세아 환승. 대안: 기존 남부 기항항을 별도 유지하되 위치·접속을 후속 결정.</text>
</svg>
