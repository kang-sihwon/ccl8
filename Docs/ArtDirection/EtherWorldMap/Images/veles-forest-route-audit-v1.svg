<text x="1345" y="221" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" fill="#566861">회색 = 평소 생활권 밖 (안전 보장 아님)</text>
<text x="75" y="277" font-family="Malgun Gothic,sans-serif" font-size="31" font-weight="700" dominant-baseline="text-before-edge" fill="#20332e">진입 · 동쪽 열매숲 → 물가 → 동굴</text>
