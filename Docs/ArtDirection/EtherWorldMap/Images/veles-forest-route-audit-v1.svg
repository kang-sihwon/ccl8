<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1320" viewBox="0 0 2100 1320"><rect width="100%" height="100%" fill="#f4f2ec"/>
<text x="75" y="48" font-family="Malgun Gothic,sans-serif" font-size="48" font-weight="700" dominant-baseline="text-before-edge" fill="#20332e">벨레스 숲 · 진입과 귀환의 생활권 간격</text>
<text x="75" y="119" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge" fill="#566861">같은 거리 축으로 비교한 평면 경로 분석 | 전투 횟수·소요 시간·실제 난도 측정 아님</text>
<text x="75" y="168" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge" fill="#20332e">색 막대는 평소 생활권을 지나는 구간이다. 개체와 조우하거나 싸운다는 보장은 없다.</text>
