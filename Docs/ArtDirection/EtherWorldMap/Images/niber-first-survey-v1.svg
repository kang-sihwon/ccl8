<text x="1190" y="204" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N01 소형정 대기 수면</text>
<text x="1190" y="238" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N02 첫 상륙 바위 해안</text>
<text x="1190" y="272" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N03 해안 위 눈턱</text>
<text x="1190" y="306" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N04 첫 회수 표지</text>
<text x="1190" y="340" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N05 설원아귀 먹이 굽이</text>
<text x="1190" y="374" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N06 높은 사면 우회</text>
<text x="1190" y="408" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N07 옛 외곽 보급소</text>
<text x="1190" y="442" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N08 순찰 기록 벽</text>
<text x="1190" y="476" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N09 첫 조사 종료 표식</text>
<text x="1190" y="510" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N10 북쪽 바람그늘 턱</text>
<text x="1190" y="544" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N11 귀환 먹이턱</text>
<text x="1190" y="578" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N12 서쪽 대체 승선점</text>
<text x="1190" y="612" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N13 대체 해안 확인점</text>
<text x="1190" y="646" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N14 바위 해안 연결</text>
<text x="1190" y="680" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N15 가져온 비상 대기처</text>
<text x="1190" y="714" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N16 봉인 짐 선택 경계</text>
<text x="1190" y="748" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N17 제외한 옛 접근점</text>
<text x="1190" y="782" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N18 내륙 후속 수색 방향</text>
<text x="1190" y="816" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293d42">N19 기억 물건 선택 턱</text>
<text x="1190" y="909" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">파랑: 접근 / 주황: 다른 귀환</text>
<text x="1190" y="944" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">녹색: 포식권 우회 / 보라: 선택·대체</text>
<text x="1190" y="979" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">N17 해빙 접근은 이번에 제외</text>
<text x="1190" y="1014" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">물길의 끝은 접안 인수 지점</text>
<text x="1190" y="1049" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">해안조 4 · 소형정 2 · 본선 10</text>
<text x="1190" y="1084" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">본선 복귀 ≠ 세라디온 귀항</text>
<text x="1190" y="1119" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">52→54 / G5 유지 / G6 미완료</text>
<text x="1190" y="1154" font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293d42">실제 지형·시야·해빙·전투 미검증</text>
