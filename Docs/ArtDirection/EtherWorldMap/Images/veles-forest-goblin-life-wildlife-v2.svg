<text x="1470" y="220" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#23404a">고블린은 공간을 사용한다</text>
<text x="1470" y="268" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">황갈색: 각 집단의 행동 예시</text>
<text x="1470" y="316" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">보라색: 같은 GB05 두 명의 운반길</text>
<text x="1470" y="364" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">① 동쪽 적재 → ② 동쪽 연결</text>
<text x="1470" y="412" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">③ B02 도하 → ④ 서쪽 분류</text>
<text x="1470" y="460" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">⑤ O2 확인 → 같은 길로 복귀</text>
<text x="1470" y="508" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">시작점·종점 동시 배치가 아님</text>
<text x="1470" y="556" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">경로의 실제 위치와 시각은 미정</text>
<text x="1470" y="604" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a"></text>
<text x="1470" y="634" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">일반 동물은 숲의 생활이다</text>
<text x="1470" y="682" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">초록 표식: 관찰 장소 예시</text>
<text x="1470" y="730" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">다람쥐: 먹이와 둥지</text>
<text x="1470" y="778" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#23404a">새: 나뭇가지·먹이·물가</text>
<text x="1470" y="826" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">토끼: 초지와 은신처</text>
<text x="1470" y="874" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">사슴: 풀밭과 수로 접근</text>
<text x="1470" y="922" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">표식 수 ≠ 개체 수 / 전투 대상 수</text>
<text x="1470" y="970" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a"></text>
<text x="1470" y="1000" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">늑대는 접근 시 위험할 수 있음</text>
<text x="1470" y="1048" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">사냥 과제·필수 처치 조건 없음</text>
<text x="1470" y="1096" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">동물 반응을 적 경보기로 고정 안 함</text>
<text x="1470" y="1144" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a"></text>
<text x="1470" y="1174" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#23404a">이동 AI·포식·재등장 미검증</text>
