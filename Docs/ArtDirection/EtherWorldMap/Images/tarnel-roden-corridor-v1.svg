<text x="1200.000" y="875.000" font-size="25" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">다른 제방길로 돌아와 기록·인계</text>
<text x="1200.000" y="917.000" font-size="25" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">상류 왕래는 별도 배편·소량 육로</text>
