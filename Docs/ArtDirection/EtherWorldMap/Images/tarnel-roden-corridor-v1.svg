<text x="1200.000" y="1052.000" font-size="24" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">강선 길이는 투영 평면상의 합계</text>
<text x="1200.000" y="1094.000" font-size="24" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">수심·유속·운항 시간은 미검증</text>
<text x="1200.000" y="1136.000" font-size="24" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">확대도 지형·무리 배치는 새 후보</text>
<text x="1200.000" y="1178.000" font-size="24" font-family="Malgun Gothic, sans-serif" font-weight="400" fill="#657a7a">36개 정착지와 원본 17절점은 유지</text>
