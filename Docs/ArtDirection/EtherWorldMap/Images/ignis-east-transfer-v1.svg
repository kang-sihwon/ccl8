<text x="700.000" y="405.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">도시·해안·기존 항로·접안 기준점을 옮기지 않았다.</text>
<text x="700.000" y="480.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#263d43" font-weight="400">이 도면의 투영 평면 선분 합: 3,553.14 km.</text>
<text x="700.000" y="555.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">실제 항해 거리·기항 수·운항 일수의 계산값이 아니다.</text>
<text x="700.000" y="630.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">짧은 현지 이동으로 생략하지 않고 계약 환승으로 다룬다.</text>
<text x="700.000" y="705.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">동안항은 조선·승무원·비축 인수 장소다.</text>
<text x="700.000" y="780.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">왕실 징발권만으로 선박·선원·곡물을 가져오지 않는다.</text>
<text x="700.000" y="855.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">보호림·주민 식량·파종분을 남긴 반출 물량을 계약한다.</text>
<text x="700.000" y="930.000" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#687b7b" font-weight="400">T3와 T5는 이 좌표도에 임의 투영하지 않았다.</text>
<polyline points="90.000,1300.000 260.000,1300.000" fill="none" stroke="#263d43" stroke-width="4"/>
<text x="90.000" y="1342.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">500 km · 기존 투영 좌표</text>
