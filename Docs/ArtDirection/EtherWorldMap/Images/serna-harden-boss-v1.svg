<text x="663.400" y="625.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">착지 중심</text>
<text x="1300.000" y="233.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#263d43" font-weight="400">120×80m 하역 단 / 착지 띠 30×24m 후보</text>
<text x="1300.000" y="291.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">B1 3.5m·B2 3m 암석: 지상 직선 공격 엄폐</text>
<text x="1300.000" y="349.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">B3 1.2m 낮은 돌: 이동 분리, 완전 엄폐 아님</text>
<text x="1300.000" y="407.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">상단 접근 → 착지 옆면 → 취수장 또는 남쪽 철수</text>
<text x="1300.000" y="465.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">최소 통행 폭 6m, 주 전투 띠 12m 이상 후보</text>
<text x="1300.000" y="523.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">돌 뒤 대기를 안전지대나 무적 판정으로 삼지 않음</text>
<text x="1300.000" y="581.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">배회·잠복·재상승에 맞춰 자리를 바꾼다.</text>
<text x="1300.000" y="639.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">돌진 후 착지·먹이 옮김 때 모든 무기 접근 가능.</text>
<text x="1300.000" y="697.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">비룡 크기·날개·카메라·충돌은 실행 미검증.</text>
<polyline id="scale-bar" points="90.000,1400.000 184.000,1400.000" fill="none" stroke="#263d43" stroke-width="5"/>
<text x="90.000" y="1434.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">20 m · 투영 평면</text>
<text x="520.000" y="1435.000" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#657a7a" font-weight="400">지형·시야·수리·전투 실행 미검증 | 일반 동물은 전투 목표가 아니다.</text>
