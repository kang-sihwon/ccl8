<circle id="pass-NP01" cx="946.800" cy="322.562" r="5.000" fill="#417c67" stroke="#417c67"/>
<text x="966.800" y="325.562" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#417c67" font-weight="400">NP01</text>
<text x="1350.000" y="227.000" font-family="Malgun Gothic,sans-serif" font-size="27" fill="#263d43" font-weight="700">이어지는 이야기</text>
<text x="1350.000" y="275.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">1 하르덴 인계 → R4 공공 복귀</text>
<text x="1350.000" y="328.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">2 R3 네르바 비축·숲 탐색</text>
<text x="1350.000" y="381.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">3 관문에서 이르 합류 → 길목·케르딘</text>
<text x="1350.000" y="434.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">4 새 고개 접근 → 거수 유도·조사대 구조</text>
<text x="1350.000" y="487.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">5 기다림·재출발 → 겨울지기·기록 회수</text>
<text x="1350.000" y="540.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#263d43" font-weight="400">6 인계 후 같은 회랑으로 중앙 복귀</text>
<text x="1350.000" y="593.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400"></text>
<text x="1350.000" y="646.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">거주 도시는 모두 산맥 남쪽에 유지.</text>
<text x="1350.000" y="699.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">북쪽 분지는 별도 유적·계절 탐사권.</text>
<text x="1350.000" y="752.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">회색 굵은 선은 원본 백풍 산맥 D01.</text>
<text x="1350.000" y="805.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">보라선·NP01은 미검증 접근 후보.</text>
<text x="1350.000" y="858.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">지도 거리로 여행 시간을 확정하지 않음.</text>
<text x="1350.000" y="911.000" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#657a7a" font-weight="400">R3/하천 겹침은 계곡 회랑, 수면 도보 아님.</text>
