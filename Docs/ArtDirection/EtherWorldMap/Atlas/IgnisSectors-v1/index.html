function resize(){w=innerWidth;h=Math.max(200,innerHeight-100);canvas.width=w;canvas.height=h;canvas.style.width=w+'px';canvas.style.height=h+'px';fit()}
function fit(){scale=Math.min(w/DATA.width,h/DATA.height);offsetX=(w-DATA.width*scale)/2;offsetY=(h-DATA.height*scale)/2;draw()}
function zoom(f,x=w/2,y=h/2){const next=Math.max(Math.min(w/DATA.width,h/DATA.height)*.65,Math.min(2,scale*f));const wx=(x-offsetX)/scale,wy=(y-offsetY)/scale;scale=next;offsetX=x-wx*scale;offsetY=y-wy*scale;draw()}

const boxes=[];ctx.font='18px Malgun Gothic';for(const p of [...DATA.points,...DATA.landmarks]){if(!allPlaces&&p.kind!=='major'&&p.kind!=='landmark'&&p.id!=='V01')continue;const x=offsetX+p.x*scale,y=offsetY+p.y*scale;if(x<0||x>w||y<0||y>h)continue;ctx.fillStyle=p.id==='V01'?'#92e7ef':'#e0e2de';if(p.kind==="landmark"){ctx.strokeStyle="#d7b56b";ctx.lineWidth=1.5;ctx.strokeRect(x-4,y-4,8,8)}else{ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();}if(p.id==="V01"){ctx.strokeStyle="#92e7ef";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+6,y-15);ctx.stroke();}let tx=x+30,ty=y-25;const tw=ctx.measureText(p.name).width;if(p.kind==="landmark"){tx=x-45-tw;ty=y+34;}if(tx+tw>w-8)tx=x-30-tw;for(let n=0;n<25;n++){if(!boxes.some(b=>tx<b[0]+b[2]+8&&tx+tw>b[0]-8&&ty-14<b[1]+b[3]&&ty+10>b[1]))break;ty+=26;}ty=Math.max(18,Math.min(h-15,ty));boxes.push([tx,ty-17,tw,26]);const terminal=tx<x?tx+tw+8:tx-8;ctx.strokeStyle='#c4ccc6';ctx.globalAlpha=.85;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(terminal+(tx<x?8:-8),ty-5);ctx.lineTo(terminal,ty-5);ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#162327';ctx.lineWidth=3;ctx.strokeText(p.name,tx,ty);ctx.fillStyle='#efefea';ctx.fillText(p.name,tx,ty)}
