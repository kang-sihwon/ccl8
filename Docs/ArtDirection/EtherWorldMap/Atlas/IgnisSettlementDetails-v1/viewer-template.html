<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이그니스 대륙 상세 도안</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15333a;color:#efefea;font-family:'Malgun Gothic',sans-serif}header,footer{position:absolute;left:0;right:0;height:50px;background:#1e2020;display:flex;align-items:center;padding:0 22px;gap:14px;z-index:3}header{top:0}footer{bottom:0;font-size:14px}header strong{font-size:24px;font-weight:400}nav{margin-left:auto;display:flex;gap:7px}button,select{background:#292c2c;color:#efefea;border:1px solid #626b6b;border-radius:0;font:14px 'Malgun Gothic';padding:6px 9px;cursor:pointer}button[aria-pressed=true]{border-color:#92e7ef;color:#92e7ef}canvas{position:absolute;top:50px;left:0;cursor:grab;touch-action:none}#status{margin-left:auto}#note{position:absolute;top:62px;left:20px;max-width:700px;background:#1e2020df;font-size:13px;padding:7px 12px;pointer-events:none;z-index:2}#tip{position:absolute;right:20px;bottom:62px;background:#1e2020df;padding:7px 12px;font-size:13px;pointer-events:none}@media(max-width:1000px){header{padding:0 8px;gap:8px}header strong{font-size:17px}nav{gap:3px}button,select{padding:5px;font-size:12px}footer{font-size:11px;padding:0 8px;gap:5px}.optional{display:none}}
</style>
<header><strong id="title">이그니스 대륙</strong><nav><select id="settlement" aria-label="정착지 선택"><option value="">정착지 선택</option></select><button id="focus">상세</button><button id="region">일대</button><button id="compare" aria-pressed="false">원본 비교</button><button id="grid" aria-pressed="false">격자</button><button id="labels" aria-pressed="true">이름</button><button id="routes" aria-pressed="false">이동로</button><button id="fit">대륙 전체</button></nav><span class="optional">N ↑</span></header>
<canvas id="map"></canvas><div id="note">제작용 배치 후보 · 정착지 중심부 상세화</div><div id="tip">정착지를 선택하거나 지도 표식을 눌러 확대</div>
<footer><span style="color:#92e7ef">●</span>상세 제작 구역<span>｜</span><span>● 정착지·장소</span><span>｜</span><span style="color:#d7b56b">□</span>주요 장소<span id="status"></span><span class="optional">휠 확대·축소　드래그 이동　Esc 전체</span></footer>
<script>
const DATA=__DATA__;
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),select=document.querySelector('#settlement'),status=document.querySelector('#status'),note=document.querySelector('#note');
let width=0,height=0,zoom=1,cx=0,cy=0,aspect=1,selected=null,grid=false,labels=true,routes=false,compare=false,drag=null,moved=false,drawQueued=false,hits=[],painted=[],labelBoxes=[];
const images=new Map(),errors=[],allTiles=DATA.settlements.flatMap(s=>s.tiles.filter(t=>t.available).map(t=>({...t,settlement:s.id})));
function requestDraw(){if(!drawQueued){drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw()})}}
function img(url){let e=images.get(url);if(!e){const image=new Image();e={image,ready:false,last:performance.now()};images.set(url,e);image.onload=()=>{e.ready=true;requestDraw()};image.onerror=()=>{e.failed=true;errors.push(url);requestDraw()};image.src=url;}e.last=performance.now();return e.ready?e.image:null;}
function screen(x,y){return[width/2+(x-cx)*zoom*aspect,height/2+(y-cy)*zoom]}
function world(x,y){return[cx+(x-width/2)/zoom/aspect,cy+(y-height/2)/zoom]}
function visible(b){const a=screen(b[0],b[1]),z=screen(b[2],b[3]);return z[0]>=0&&a[0]<=width&&z[1]>=0&&a[1]<=height;}
function plate(url,b,opacity=1){if(!visible(b))return;const im=img(url);if(!im)return;const a=screen(b[0],b[1]),z=screen(b[2],b[3]);ctx.globalAlpha=opacity;ctx.drawImage(im,a[0],a[1],z[0]-a[0],z[1]-a[1]);ctx.globalAlpha=1;painted.push(url);}
function bounds(tiles){return[Math.min(...tiles.map(t=>t.worldPixelBounds[0])),Math.min(...tiles.map(t=>t.worldPixelBounds[1])),Math.max(...tiles.map(t=>t.worldPixelBounds[2])),Math.max(...tiles.map(t=>t.worldPixelBounds[3]))]}
function frame(b,local){cx=(b[0]+b[2])/2;cy=(b[1]+b[3])/2;aspect=local?Math.max(.15,Math.cos(Math.PI/2-cy/DATA.worldSize[1]*Math.PI)):1;zoom=Math.min((width-70)/((b[2]-b[0])*aspect),(height-70)/(b[3]-b[1]));requestDraw();}
function fit(){selected=null;select.value='';document.querySelector('#title').textContent='이그니스 대륙';frame(DATA.background.bounds,false);}
function focus(id,region=false){selected=DATA.settlements.find(s=>s.id===id);if(!selected)return;select.value=id;document.querySelector('#title').textContent=selected.name+' 일대';const tiles=selected.tiles.filter(t=>t.available);frame(region?selected.contextBounds:tiles.length?bounds(tiles):selected.contextBounds,true);}
function label(name,p,index=0,special=false){const [x,y]=screen(...p);if(x<0||x>width||y<0||y>height)return;ctx.font='18px "Malgun Gothic",sans-serif';const tw=ctx.measureText(name).width;let tx,ty,box;
 const offsets=[[30,-24],[-30-tw,24],[30,38],[-30-tw,-42],[40,70],[-40-tw,-76],[70,-100],[-70-tw,100]];
 for(let i=0;i<offsets.length;i++){const d=offsets[(i+index)%offsets.length],xx=Math.min(width-tw-12,Math.max(12,x+d[0])),yy=Math.min(height-18,Math.max(35,y+d[1])),candidate=[xx-5,yy-17,xx+tw+5,yy+10];if(!labelBoxes.some(b=>candidate[0]<b[2]&&candidate[2]>b[0]&&candidate[1]<b[3]&&candidate[3]>b[1])){tx=xx;ty=yy;box=candidate;break}}
 if(!box)return;labelBoxes.push(box);const ex=tx>=x?tx-6:tx+tw+6;
 ctx.strokeStyle='#c4ccc6';ctx.globalAlpha=.85;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(ex-x)*.55,ty);ctx.lineTo(ex,ty);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=special?'#d7b56b':'#e0e2de';if(special)ctx.strokeRect(x-3,y-3,6,6);else{ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill()}ctx.lineWidth=3;ctx.strokeStyle='#162327';ctx.strokeText(name,tx,ty+6);ctx.fillStyle='#efefea';ctx.fillText(name,tx,ty+6);}
function draw(){
 if(!width||!height)return;ctx.clearRect(0,0,width,height);ctx.fillStyle='#15333a';ctx.fillRect(0,0,width,height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';painted=[];hits=[];labelBoxes=[];
 plate(DATA.background.preview,DATA.background.bounds);
 if(zoom>.00025)for(const t of DATA.background.tiles)plate(t.path,t.worldPixelBounds);
 if(zoom>.003)for(const s of DATA.settlements)if(s.context&&visible(s.contextBounds))plate(s.context,s.contextBounds);
 if(!compare&&zoom>.015)for(const t of allTiles)plate(t.path,t.worldPixelBounds);
 if(routes&&zoom<.01){ctx.lineWidth=1.3;for(const f of DATA.features.filter(f=>f.kind==='route')){ctx.strokeStyle=f.mode==='road'?'#c2b494':f.mode==='sea'?'#8eb7ba':'#82b7cd';ctx.beginPath();f.worldPixelPoints.forEach((p,i)=>{const a=screen(...p);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.stroke()}}
 if(grid){const ts=zoom>.003?allTiles:DATA.background.tiles;ctx.font='12px "Malgun Gothic"';for(const t of ts){if(!visible(t.worldPixelBounds))continue;const a=screen(...t.worldPixelBounds.slice(0,2)),b=screen(...t.worldPixelBounds.slice(2));ctx.strokeStyle='#92e7ef88';ctx.lineWidth=1;ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);if(b[0]-a[0]>140){ctx.fillStyle='#efefea';ctx.fillText(t.id,a[0]+6,a[1]+18)}}}
 if(zoom<.003){const placed=[];for(const s of DATA.settlements){const p=screen(...s.worldPixel);if(p[0]<0||p[0]>width||p[1]<0||p[1]>height)continue;ctx.fillStyle=s.tiles.some(t=>t.available)?'#92e7ef':'#e0e2de';ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill();hits.push({id:s.id,x:p[0],y:p[1]});if(labels&&(s.kind==='major'||zoom>.0004)&&!placed.some(q=>Math.abs(q[0]-p[0])<130&&Math.abs(q[1]-p[1])<35)){label(s.name,s.worldPixel,placed.length);placed.push(p)}}}
 else if(labels){for(const s of DATA.settlements){if(!visible(s.contextBounds))continue;label(s.name,s.worldPixel);s.points.forEach((p,i)=>label(p.name,p.worldPixel,i+1));}}
 const detailHere=allTiles.some(t=>cx>=t.worldPixelBounds[0]&&cx<=t.worldPixelBounds[2]&&cy>=t.worldPixelBounds[1]&&cy<=t.worldPixelBounds[3]);
 status.textContent=zoom>.003?(compare?'기존 배치 참고':detailHere?'새 상세 도안':'상세 구역 밖 · 기존 참고'):'정착지 36곳';
 note.textContent=selected?.registration?'벨레스: 나루·동굴 기준의 임시 정합 · 다른 시설 좌표 차이 남음':selected?'새 상세 구역 + 기존 일대 참고 · 개별 건물 치수 미확정':'대륙 배경과 정착지 상세 도안 · 정착지 사이 배경은 개략도';
 if(errors.length)status.textContent+=' · 파일 오류 '+errors.length;
 if(images.size>70){const visibleSet=new Set(painted);for(const [url,e]of [...images].sort((a,b)=>a[1].last-b[1].last)){if(images.size<=60)break;if(!visibleSet.has(url)&&e.ready)images.delete(url)}}
}
function resize(){const w=innerWidth,h=innerHeight-100;if(w<=0||h<=0||(w===width&&h===height))return;const first=!width;const dpr=Math.min(devicePixelRatio||1,2);width=w;height=h;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);first?fit():requestDraw();}
for(const s of DATA.settlements){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' '+s.name;select.append(o)}select.onchange=()=>focus(select.value);document.querySelector('#focus').onclick=()=>focus(select.value||'M01');document.querySelector('#region').onclick=()=>focus(select.value||'M01',true);document.querySelector('#fit').onclick=fit;
for(const id of ['grid','labels','routes','compare'])document.querySelector('#'+id).onclick=e=>{if(id==='grid')grid=!grid;if(id==='labels')labels=!labels;if(id==='routes')routes=!routes;if(id==='compare')compare=!compare;e.target.setAttribute('aria-pressed',String({grid,labels,routes,compare}[id]));requestDraw()};
canvas.addEventListener('wheel',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,p=world(x,y),z=Math.max(.00002,Math.min(4,zoom*Math.exp(-e.deltaY*.0015)));zoom=z;cx=p[0]-(x-width/2)/zoom/aspect;cy=p[1]-(y-height/2)/zoom;requestDraw()},{passive:false});
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx,cy};moved=false;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)moved=true;cx=drag.cx-dx/zoom/aspect;cy=drag.cy-dy/zoom;requestDraw()};canvas.onpointerup=e=>{if(!moved){const rect=canvas.getBoundingClientRect(),hit=hits.find(p=>Math.hypot(p.x-e.clientX+rect.left,p.y-e.clientY+rect.top)<14);if(hit)focus(hit.id)}drag=null;};canvas.onpointercancel=()=>drag=null;
addEventListener('keydown',e=>{if(e.key==='Escape')fit()});addEventListener('resize',resize);window.mapDebug=()=>({ready:!!images.get(DATA.background.preview)?.ready,zoom,cx,cy,aspect,selected:selected?.id,grid,labels,routes,compare,loaded:[...images.values()].filter(i=>i.ready).length,painted,errors,availableTiles:allTiles.length});window.mapFocus=focus;resize();
</script></html>
