<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벨레스 상세 지형과 연결 구간</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#1e2020;color:#efefea;font:15px 'Malgun Gothic',sans-serif}header,footer{position:fixed;left:0;right:0;z-index:2;background:#1e2020;display:flex;align-items:center;gap:15px;padding:0 22px;height:50px}header{top:0}footer{bottom:0;font-size:13px;color:#c4ccc6}header strong{font-size:23px;font-weight:500}.spacer{flex:1}button{background:#303738;border:1px solid #566164;color:#efefea;padding:7px 11px;font:inherit;cursor:pointer}canvas{display:block;position:absolute;top:50px;touch-action:none}#note{position:fixed;top:62px;left:18px;padding:7px 11px;background:#1e2020cd;z-index:2;font-size:12px;color:#d5ddda;pointer-events:none}#status{white-space:nowrap}</style>
<header><span>이그니스 타이가</span><span>›</span><strong id="title">벨레스 일대</strong><span class="spacer"></span><button data-view="village">건물·골목</button><button data-view="forest">숲·동굴</button><button data-view="west">서쪽 연결</button><button data-view="north">북쪽 연결</button><button data-view="all">전체 구역</button><button id="grid">경계</button><button id="labels">이름</button><button id="footprints">건물 외곽</button><span>N ↑</span></header>
<div id="note">공통 지형 원본을 상속한 상세 제작 후보 · 건물 치수·길 폭은 검토용</div><canvas id="map"></canvas><footer><span style="color:#92e7ef">● 공방</span><span>│</span><span>● 장소</span><span>│</span><span style="color:#d7b56b">□ 주요 장소</span><span class="spacer"></span><span id="status"></span><span>휠 확대·축소 │ 드래그 이동</span></footer>
<script src="scene.js"></script><script src="assets.js"></script><script src="renderer.js"></script><script>
const canvas=document.querySelector('#map');let cx=-135,cy=160,zoom=1,labels=true,grid=false,footprints=false,drag=null,view='village',pending=false;
const frames={village:[-400,-40,160,300],forest:[-540,190,640,1510],west:[-2020,-750,-700,100],north:[-700,1700,1700,3500],all:SCENE.bounds};
function frame(name){view=name;const b=frames[name];cx=(b[0]+b[2])/2;cy=(b[1]+b[3])/2;zoom=Math.min(canvas.width/(b[2]-b[0]),canvas.height/(b[3]-b[1]));document.querySelector('#title').textContent=name==='village'?'벨레스 일대':name==='forest'?'숲·동굴 접근로':name==='all'?'벨레스 전체 연결 구역':name==='west'?'숲곁 방향 연결로':'솔숨 방향 연결로';draw();}
function bounds(){return[cx-canvas.width/zoom/2,cy-canvas.height/zoom/2,cx+canvas.width/zoom/2,cy+canvas.height/zoom/2];}
function draw(){if(pending||!ready)return;pending=true;requestAnimationFrame(()=>{pending=false;try{render(canvas,bounds(),labels,grid,footprints);document.querySelector('#status').textContent=(1/zoom).toFixed(2)+'m/화면px · 고도 2m · '+SCENE.buildings.length+'개 건물';}catch(e){errors.push(String(e));document.querySelector('#note').textContent='오류: '+e;}});}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame(b.dataset.view));document.querySelector('#grid').onclick=()=>{grid=!grid;draw();};document.querySelector('#labels').onclick=()=>{labels=!labels;draw();};document.querySelector('#footprints').onclick=()=>{footprints=!footprints;draw();};
canvas.onwheel=e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left-canvas.width/2,y=e.clientY-rect.top-canvas.height/2,old=zoom;zoom=Math.max(.08,Math.min(10,zoom*Math.exp(-e.deltaY*.0015)));cx+=x/old-x/zoom;cy-=y/old-y/zoom;draw();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,cx,cy];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){cx=drag[2]-(e.clientX-drag[0])/zoom;cy=drag[3]+(e.clientY-drag[1])/zoom;draw();}};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight-100;frame(view);}window.onresize=resize;window.onerror=e=>errors.push(String(e));
window.detailDebug=()=>({ready,view,cx,cy,zoom,bounds:bounds(),labels,grid,footprints,errors,buildings:SCENE.buildings.length,trees:SCENE.vegetation.length});window.detailFrame=frame;
initRenderer().then(()=>{resize();}).catch(e=>{errors.push(String(e));document.querySelector('#note').textContent='로딩 실패: '+e;});
</script></html>
