<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이그니스 · 세계수 관리도시 상세 도안</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15333a;color:#efefea;font:16px 'Malgun Gothic',sans-serif}header,footer{position:absolute;left:0;right:0;height:50px;background:#1e2020;display:flex;align-items:center;padding:0 30px;gap:26px;z-index:2}header{top:0}footer{bottom:0;font-size:16px;gap:20px}h1{font-size:26px;font-weight:400;margin:0}button,select{background:transparent;color:#efefea;border:0;font:inherit;cursor:pointer}option{background:#1e2020}.grow{flex:1}.sep{color:#777}canvas{position:absolute;top:50px;left:0;width:100%;height:calc(100% - 100px);touch-action:none}#status{position:absolute;bottom:65px;right:18px;color:#ddd;font-size:13px;background:#1e2020c9;padding:7px 10px;pointer-events:none}#failure{position:absolute;top:70px;left:30px;color:#ffb7a6}button:focus-visible{outline:1px solid #92e7ef}</style>
<header><span>이그니스 타이가</span><span>›</span><h1>세계수 관리도시 일대</h1><span class="grow"></span><button id="focus">시가지 확대</button><button id="grid" aria-pressed="false">구역 경계</button><button id="labels" aria-pressed="true">장소 표시</button><button id="fit">전체 보기</button><span>N ↑</span></header>
<canvas id="map"></canvas><div id="failure"></div><div id="status">상세 도안 불러오는 중</div>
<footer><span style="color:#92e7ef">●</span><span>현재 위치</span><span class="sep">|</span><span style="color:#e0e2de">●</span><span>정착지·장소</span><span class="sep">|</span><span style="color:#d7b56b">▫</span><span>주요 장소</span><span class="grow"></span><span>휠 확대·축소</span><span class="sep">|</span><span>드래그 이동</span><span class="sep">|</span><span>Esc 전체</span></footer>
<script>
const plan=__PLAN__;
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const W=plan.atlasSize[0],H=plan.atlasSize[1],aspect=Math.cos(53.89*Math.PI/180);
let zoom=1,ox=0,oy=0,cw=0,ch=0,grid=false,labels=true,drag=null,ready=false;
const images=new Map();
function fit(){zoom=Math.min(cw/(W*aspect),ch/H);ox=(cw-W*aspect*zoom)/2;oy=(ch-H*zoom)/2;draw();}
function focus(){zoom=Math.min(cw/(4400*aspect),ch/2304);ox=cw/2-5200*aspect*zoom;oy=ch/2-1150*zoom;draw();}
function resize(){const nw=canvas.clientWidth,nh=canvas.clientHeight;if(nw<=0||nh<=0||(nw===cw&&nh===ch))return;const first=!cw||!ch,centerX=(cw/2-ox)/(zoom*aspect),centerY=(ch/2-oy)/zoom;cw=nw;ch=nh;canvas.width=Math.round(cw*devicePixelRatio);canvas.height=Math.round(ch*devicePixelRatio);if(first)fit();else{ox=cw/2-centerX*zoom*aspect;oy=ch/2-centerY*zoom;draw();}}
function point(x,y){return [ox+x*zoom*aspect,oy+y*zoom];}
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#15333a';ctx.fillRect(0,0,cw,ch);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
for(const t of plan.tiles){const x=(t.column-plan.columns[0])*2048,y=(t.row-plan.rows[0])*2048,p=point(x,y),tw=2048*zoom*aspect,th=2048*zoom,img=images.get(t.id);if(img&&p[0]<cw&&p[1]<ch&&p[0]+tw>0&&p[1]+th>0)ctx.drawImage(img,p[0],p[1],tw+.35,th+.35);
if(grid){ctx.strokeStyle='#dce3df99';ctx.lineWidth=1;ctx.strokeRect(p[0],p[1],tw,th);ctx.font='13px sans-serif';ctx.fillStyle='#efefea';ctx.fillText(t.id,p[0]+9,p[1]+22);}}
if(labels){const offsets=[[-40,-40],[-50,45],[42,22],[32,35],[-55,35],[-35,-40],[-85,15]];plan.points.forEach((p,i)=>{const [x,y]=point(...p.atlasPixel);if(x<-10||y<-10||x>cw+10||y>ch+10)return;const [dx,dy]=offsets[i];ctx.font='18px "Malgun Gothic",sans-serif';const width=ctx.measureText(p.name).width;const tx=Math.max(16,Math.min(cw-width-16,x+dx-(dx<0?width:0))),ty=Math.max(22,Math.min(ch-22,y+dy));ctx.strokeStyle='#e0e2ded9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*.6,y+dy);ctx.lineTo(dx<0?tx+width+8:tx-8,y+dy);ctx.stroke();ctx.fillStyle='#e0e2de';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1b231ddd';ctx.strokeText(p.name,tx,ty+6);ctx.fillStyle='#efefea';ctx.fillText(p.name,tx,ty+6);});}
status.textContent=ready?'상세 도안 검토 후보 · 시설 치수 미확정':'상세 도안 불러오는 중';}
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,k=Math.exp(-e.deltaY*.0015),next=Math.max(.05,Math.min(2,zoom*k)),ratio=next/zoom;ox=x-(x-ox)*ratio;oy=y-(y-oy)*ratio;zoom=next;draw();},{passive:false});
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,ox,oy];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){ox=drag[2]+e.clientX-drag[0];oy=drag[3]+e.clientY-drag[1];draw();}};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
document.querySelector('#fit').onclick=fit;document.querySelector('#focus').onclick=focus;
document.querySelector('#grid').onclick=e=>{grid=!grid;e.target.setAttribute('aria-pressed',String(grid));draw();};document.querySelector('#labels').onclick=e=>{labels=!labels;e.target.setAttribute('aria-pressed',String(labels));draw();};window.onkeydown=e=>{if(e.key==='Escape')fit();};window.onresize=resize;
window.mapDebug=()=>({ready,zoom,ox,oy,grid,labels,loaded:images.size,tiles:plan.tiles.length});
resize();Promise.all(plan.tiles.map(t=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images.set(t.id,img);draw();resolve();};img.onerror=()=>reject(Error('이미지 로딩 실패: '+t.id));img.src='tiles/'+t.id+'.png';}))).then(()=>{ready=true;draw();}).catch(e=>document.querySelector('#failure').textContent=e.message);
</script></html>
